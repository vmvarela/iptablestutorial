name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X github.com/vmvarela/iptablestutorial/internal/version.Version=${VERSION} \
            -X github.com/vmvarela/iptablestutorial/internal/version.GitCommit=${COMMIT} \
            -X github.com/vmvarela/iptablestutorial/internal/version.BuildTime=${BUILD_TIME}"
          mkdir -p dist
          for OS in linux darwin; do
            for ARCH in amd64 arm64; do
              GOOS=$OS GOARCH=$ARCH go build \
                -ldflags="${LDFLAGS}" \
                -o dist/silvia-castillo-${OS}-${ARCH} \
                ./cmd/silvia-castillo
            done
          done
          # Windows
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="${LDFLAGS}" \
            -o dist/silvia-castillo-windows-amd64.exe \
            ./cmd/silvia-castillo

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
